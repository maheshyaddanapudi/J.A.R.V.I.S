[project]
name = "jarvis-ears"
version = "0.1.0"
description = "J.A.R.V.I.S. speech service: wake word, VAD, STT, TTS behind typed replaceable engine contracts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "sherpa-onnx>=1.12",
    "soundfile>=0.12",
    "kokoro-onnx>=0.4",
    "openwakeword>=0.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_ears"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
